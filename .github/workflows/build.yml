name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secrets de signature absents : ajoutez SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS et SIGNING_KEY_PASSWORD (voir README)."
            exit 1
          fi
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/secretaire.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE_PATH"
          ./gradlew assembleRelease
          rm -f "$SIGNING_KEYSTORE_PATH"
          mv app/build/outputs/apk/release/app-release.apk "secretaire-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: secretaire-apk
          path: secretaire-*.apk
